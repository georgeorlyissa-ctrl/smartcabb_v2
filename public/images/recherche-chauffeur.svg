<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Recherche d'un véhicule disponible à proximité">
  <title>Recherche d'un véhicule disponible</title>
  <defs>
    <radialGradient id="sc-bg" cx="50%" cy="32%" r="76%">
      <stop offset="0%" stop-color="#F7FBFF"/>
      <stop offset="50%" stop-color="#E1F0FF"/>
      <stop offset="100%" stop-color="#BEDFFF"/>
    </radialGradient>

    <linearGradient id="sc-car" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#43B2FF"/>
      <stop offset="40%" stop-color="#0098FF"/>
      <stop offset="100%" stop-color="#0055B4"/>
    </linearGradient>

    <linearGradient id="sc-glass" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#F4FCFF"/>
      <stop offset="100%" stop-color="#A9D5FF"/>
    </linearGradient>

    <linearGradient id="sc-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#003D7A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#003D7A" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sc-pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE45C"/>
      <stop offset="100%" stop-color="#FFC400"/>
    </linearGradient>
  </defs>

  <!-- Fond doux -->
  <circle cx="100" cy="100" r="96" fill="url(#sc-bg)"/>

  <!-- Onde radar -->
  <circle cx="100" cy="104" r="74" fill="none" stroke="#6DBAFF" stroke-width="2.2" stroke-dasharray="3 10" opacity="0.35" stroke-linecap="round"/>

  <!-- Repère de localisation -->
  <g>
    <circle cx="152" cy="46" r="20" fill="#0098FF" opacity="0.10"/>
    <circle cx="152" cy="46" r="14" fill="#0098FF" opacity="0.16"/>
    <path d="M152 32a11 11 0 0 0-11 11c0 7.9 11 18.5 11 18.5s11-10.6 11-18.5a11 11 0 0 0-11-11z"
          fill="url(#sc-pin)" stroke="#FFFFFF" stroke-width="2.4" stroke-linejoin="round"/>
    <circle cx="152" cy="43" r="3.8" fill="#003D7A" opacity="0.85"/>
  </g>

  <!-- Ombre au sol -->
  <ellipse cx="100" cy="150" rx="66" ry="9" fill="url(#sc-glow)"/>

  <!-- Halos derrière le véhicule -->
  <ellipse cx="100" cy="118" rx="76" ry="34" fill="#FFFFFF" opacity="0.35"/>

  <!-- Carrosserie -->
  <path d="M34 132v-14q0-8 10-10l30-7c10-15 22-21 34-21h14c15 0 25 7 31 19l6 9q9 2 9 12v12q0 4-4 4H38q-4 0-4-4z"
        fill="url(#sc-car)"/>

  <!-- Reflet de toit -->
  <path d="M52 106c9-13 20-19 32-19h14c13 0 22 6 28 17l1.5 3H50.5z"
        fill="#FFFFFF" opacity="0.18"/>

  <!-- Vitrage -->
  <path d="M78 102c8-13 17-17 30-17h8c11 0 19 5 24 15l1 2z"
        fill="url(#sc-glass)"/>
  <path d="M108 85v17" stroke="#0B4B7F" stroke-width="2.6" stroke-linecap="round" opacity="0.26"/>

  <!-- Poignée de porte -->
  <rect x="118" y="110" width="10" height="3.2" rx="1.6" fill="#FFFFFF" opacity="0.6"/>

  <!-- Phare (avant, à droite) et feu arrière -->
  <rect x="158" y="115" width="9" height="6" rx="3" fill="#FFD600"/>
  <rect x="33" y="117" width="7" height="5" rx="2.5" fill="#FF7A6B" opacity="0.9"/>

  <!-- Roues -->
  <g>
    <circle cx="66" cy="134" r="15" fill="#152B44"/>
    <circle cx="66" cy="134" r="7" fill="#DCE7F1"/>
    <circle cx="66" cy="134" r="3" fill="#9FB4C7"/>
    <circle cx="142" cy="134" r="15" fill="#152B44"/>
    <circle cx="142" cy="134" r="7" fill="#DCE7F1"/>
    <circle cx="142" cy="134" r="3" fill="#9FB4C7"/>
  </g>
</svg>
