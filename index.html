    <style id="boot-loader-css">
      .sc-boot{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(168deg,#092130 0%,#0D3145 40%,#134A63 72%,#0A2534 100%);}

      .sc-boot-vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 44%,transparent 30%,rgba(3,11,18,.62) 100%);}
      .sc-boot-route{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
      .sc-boot-inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 1.5rem;}
      .sc-boot-medal{width:112px;height:112px;border-radius:26px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#ffffff 0%,#e3edf3 60%,#c6d8e3 100%);box-shadow:0 18px 44px rgba(0,0,0,.5),0 0 0 3px rgba(127,184,212,.4),inset 0 2px 6px rgba(255,255,255,.9);}
      .sc-boot-medal img{width:100%;height:100%;object-fit:contain;padding:7px;}
      .sc-boot-brand{margin:1rem 0 0;color:#fff;font-family:'Montserrat',system-ui,-apple-system,sans-serif;font-size:23px;font-weight:900;letter-spacing:.2em;line-height:1.1;padding-left:.2em;}
      .sc-boot-brand span{color:#7FB8D4;}
      .sc-boot-track{width:96px;height:3px;margin:1rem auto 0;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden;}
      .sc-boot-bar{display:block;width:38%;height:100%;border-radius:99px;background:#FFCC00;animation:sc-boot-bar-slide 1.15s cubic-bezier(.4,0,.2,1) infinite;will-change:transform;}
      @keyframes sc-boot-bar-slide{0%{transform:translateX(-120%);}100%{transform:translateX(280%);}}
      .sc-boot-footer{position:absolute;left:0;right:0;bottom:calc(10% + env(safe-area-inset-bottom,0px));z-index:2;text-align:center;padding:0 1.5rem;}
      .sc-boot-tagline{margin:0;color:#fff;font-family:'Montserrat',system-ui,-apple-system,sans-serif;font-size:19px;font-weight:800;line-height:1.25;}
      .sc-boot-place{margin:6px 0 0;color:rgba(255,255,255,.68);font-family:'Poppins',system-ui,-apple-system,sans-serif;font-size:13px;font-weight:500;line-height:1.4;}
      .sc-boot-msg{margin:.75rem 0 0;color:rgba(255,255,255,.55);font-size:11px;letter-spacing:.18em;text-transform:uppercase;}
      @media (max-width:380px){.sc-boot-medal{width:96px;height:96px;border-radius:22px;}.sc-boot-brand{font-size:20px;}.sc-boot-tagline{font-size:16px;}.sc-boot-place{font-size:11.5px;}}
      @media (prefers-reduced-motion: reduce){.sc-boot-bar{animation:none;width:60%;transform:none;}}
